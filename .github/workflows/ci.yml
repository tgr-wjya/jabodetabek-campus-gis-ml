name: CI/CD Pipeline

on:
  push:
    branches: [ main, feat/vercel-migration ]
  pull_request:
    branches: [ main, feat/vercel-migration ]

jobs:
  backend-quality:
    name: Python Quality Gates & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-cov httpx
      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest --cov=. test_*.py

  vercel-build-check:
    name: Vercel Configuration & Build Verification
    runs-on: ubuntu-latest
    needs: backend-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Vercel Configuration
        run: |
          test -f vercel.json || (echo "vercel.json missing" && exit 1)
