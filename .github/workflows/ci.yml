name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests with Coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing test_*.py

      - name: Run Spatial Latency Benchmark
        run: |
          python test_latency.py

  sonarcloud:
    name: SonarQube / SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Generate Coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml test_*.py

      - name: SonarCloud / SonarQube GitHub Action
        uses: sonarsource/sonarcloud-github-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Streamlit App in Background
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true > streamlit.log 2>&1 &
          npx wait-on http://localhost:8501 --timeout 30000 || (cat streamlit.log && exit 1)

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8501
          uploadTargets: 'temporary-public-storage'
          configPath: './.lighthouserc.json'
